name: catalog

on:
  schedule:
    - cron: "13 2 * * 2"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: mimi-deck-catalog
  cancel-in-progress: false

jobs:
  refresh:
    runs-on: ubuntu-latest
    timeout-minutes: 1
    steps:
      - uses: actions/checkout@v6
      - uses: voidzero-dev/setup-vp@v1
        with:
          node-version: "24"
          cache: true
      - run: vp install --frozen-lockfile
      - run: npm run catalog:update
      - run: npm run release:check
      - run: npm run check
      - run: npm test
      - run: npm run build
      - name: Publish a changed catalog
        shell: bash
        run: |
          if git diff --quiet -- public/episodes.json; then
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -- public/episodes.json
          git commit -m "chore: refresh podcast catalog"
          git push
